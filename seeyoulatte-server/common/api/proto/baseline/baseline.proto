syntax = "proto3";
package baseline;

option go_package = "github.com/darkphotonKN/seeyoulatte-app/common/api/proto/baseline";

// BaselineService — decorative service demonstrating the gRPC + AMQP
// publish/consume pattern. Not load-bearing; used as a template for future
// extractions from the api-gateway monolith.
service BaselineService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string reply = 1;
  string served_by = 2;
}
